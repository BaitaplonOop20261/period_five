[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Logic regression checks use Java assertions and the existing LibGDX API only.
sourceSets {
  regression {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
  }
}

tasks.register('regressionTest', JavaExec) {
  group = 'verification'
  description = 'Checks dialogue and inventory behavior without an OpenGL context.'
  dependsOn tasks.named('regressionClasses')
  classpath = sourceSets.regression.runtimeClasspath
  mainClass = 'vn.room304.game.RegressionChecks'
  enableAssertions = true
  args layout.buildDirectory.dir('regression-fixtures').get().asFile.absolutePath
}

tasks.named('check') {
  dependsOn tasks.named('regressionTest')
}
