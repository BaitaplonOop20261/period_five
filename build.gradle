buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

// Both modules share one generated asset list. Write only when the task executes.
def assetsFolder = layout.projectDirectory.dir('assets').asFile
def assetsFile = new File(assetsFolder, 'assets.txt')
def assetFiles = fileTree(assetsFolder) { exclude 'assets.txt' }
tasks.register('generateAssetList') {
  inputs.files(assetFiles).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.file(assetsFile)
  doLast {
    def paths = assetFiles.files.collect { assetsFolder.relativePath(it) }.sort()
    assetsFile.setText(paths.join('\n') + '\n', 'UTF-8')
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21

  processResources.dependsOn rootProject.tasks.named('generateAssetList')

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Room304'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'Room304' + '-parent'
